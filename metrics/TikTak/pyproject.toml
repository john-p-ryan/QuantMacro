[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantmacro-tiktak"
version = "0.1.0"
description = "Restartable, parallel TikTak optimization for structural estimation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.14"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tiktak*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
